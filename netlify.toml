# Chapter 20 is a static Vite site (this repo used to hold a Next.js app)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # the site was first set up for the Next.js trivia app; its Next.js plugin must not run here
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
